plugins { id 'com.android.application' }

android {
    namespace 'com.nightflow.game'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nightflow.game'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0.0'
        testInstrumentationRunner 'com.nightflow.game.SmokeRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
        checkReleaseBuilds false
        disable 'ObsoleteSdkInt', 'SetTextI18n'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
