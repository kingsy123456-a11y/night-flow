name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: night-flow-android
  cancel-in-progress: true
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile, lint and test
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
      - name: Run on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          disable-animations: true
          script: bash scripts/smoke.sh
      - name: Prepare installable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Night-Flow.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Night-Flow.apk
          sha256sum dist/Night-Flow.apk > dist/SHA256SUMS.txt
      - name: Download Night Flow APK
        uses: actions/upload-artifact@v7
        with:
          path: dist/Night-Flow.apk
          archive: false
          if-no-files-found: error
          retention-days: 90
      - name: Build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Night-Flow-checks
          path: |
            app/build/reports/
            app/build/test-results/
            smoke-results/
            dist/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 30
